# PARE worker registry. Each entry maps to an agent_core WorkerSpec.
#
# EVERY KEY A WORKER MAY CARRY. agent_core's WorkerSpec sets extra="forbid", so
# an unknown key is not ignored -- it aborts the WHOLE file, leaving no workers
# AND no risk_overrides. A typo here takes the entire fleet down, so this list
# is the operator's map and tests/test_workers_yaml_format_comment.py fails if
# it drifts from WorkerSpec. Do not prune it by hand.
#
#   transport         stdio | streamable_http   (required)
#   risk_default      low | medium | high | critical   (the FLOOR; see below)
#   kind              internal | external_mcp
#   capability_tags   list of strings, for /worker discovery
#
#   -- stdio workers: a process PARE launches and speaks to over stdin/stdout
#   command           absolute path to the executable
#   args              list of arguments
#   env               mapping of environment variables for the child
#   cwd               working directory for the child
#   container         container image, when the worker is run as one
#
#   -- networked workers: streamable_http over the tailnet
#   endpoint          full URL, e.g. http://100.68.47.23:9101/mcp
#   connect_timeout   seconds to wait for the initial connection
#   read_timeout      seconds to wait for a response
#
#   -- lifecycle
#   autoload          connect at boot (default true). REQUIRED false for a
#                     networked worker -- see the NOTE below.
#
#   -- artifacts (declared, not yet enforced; see the ArcticBase/artifacts spec)
#   artifact_root     absolute path on the WORKER's machine where it may write
#                     artifacts. Validated at load: must be absolute, carry no
#                     '..' component, and not begin with exactly two slashes --
#                     the same lexical rule pare-worker-kit enforces, so a root
#                     that loads here is one the worker will accept.
#   artifact_drive_id expected contents of {artifact_root}/.bench-store-id, so
#                     one project's removable drive is distinguishable from
#                     another's.
#
# stdio workers (a process PARE launches and talks to over stdin/stdout) are
# declared with `command` + `args` instead of `endpoint` — e.g. the in-house
# Python Frida MCP server. risk_default sets the HITL tier: low/medium
# auto-execute (audited); high needs operator approval; critical needs approval
# + justification. See the README "Workers & risk gating" section.
#
# NOTE (2026-05-30): the 8 apk_re_agents Streamable-HTTP workers are temporarily
# commented out below. Their backing services (:9000–9007) aren't running, and
# agent_core's discover_and_register currently lets an unreachable HTTP worker's
# botched cancellation cascade and cancel sibling workers' discovery (including
# frida). Re-enable them once (a) those services are up AND (b) the agent_core
# discovery-robustness fix lands. See docs/superpowers/plans for the follow-up.
workers:
  #  frida:
  #    command: /mnt/secondary/projects/PARE/.venv/bin/pare-frida-mcp
  #    transport: stdio
  #    risk_default: low           # advertised per-tool tiers govern; reads auto-execute, dangerous tools gate (read_memory/java_hook/write_memory=high, execute_script=critical)
  #    autoload: true
  #   capability_tags: [mobile, dynamic, android, frida]
  frida:
    endpoint: http://100.68.47.23:9101/mcp     # the laptop's tailnet address
    transport: streamable_http
    connect_timeout: 20
    read_timeout: 60
    risk_default: low
    autoload: false        # REQUIRED — see below
    capability_tags: [mobile, dynamic, android, frida]

  # In-house static-analysis worker (pare-static-mcp). Read-only APK tools
  # (current count and names: `/worker tools static`), all wire tier low →
  # auto-execute + audited, none gated. Tools surface to the
  # model as static_* (agent_core prefixes by worker name). Requires the worker
  # installed into this venv: `pip install -e ~/Projects/pare-static-mcp`, plus an
  # external jadx binary on PATH (or JADX_PATH) for the Java decompile path (the
  # smali path works without jadx). See docs/superpowers/ for the design + plan.
  static:
    command: /mnt/secondary/projects/PARE/.venv/bin/pare-static-mcp
    transport: stdio
    risk_default: low
    autoload: true
    capability_tags: [static, apk, android]

  # In-house HTTPS-traffic worker (pare-mitm-mcp). ELEVEN tools over a localhost
  # control API served by an operator-launched mitmproxy daemon — NOT read-only:
  # five reads plus list_rules are wire tier low, but delete_rule/clear_rules are
  # also low (they mutate), add_blocking_rule/add_modification_rule/replay_flow
  # are high, and inject_request is critical. No operator pins cover any of them,
  # so that gating rests entirely on wire metadata. Tools surface as mitm_*.
  # Mounted unconditionally, like
  # static/frida. Requires the worker installed into this venv (`pip install -e
  # ~/Projects/pare-mitm-mcp`) and the daemon started via `/mitm up`. See
  # docs/superpowers/ for the design + plan.
  mitm:
    command: /mnt/secondary/projects/PARE/.venv/bin/pare-mitm-mcp
    transport: stdio
    risk_default: low
    autoload: true
    capability_tags: [traffic, https, mitm, dynamic]

  # Declared but NOT connected at boot: hardware work is occasional, and its
  # tool schemas cost context in every turn that isn't doing it. Load it when a
  # target actually has hardware in play:  /worker load hardware
  # The worker itself is still being built (../pare-hardware-mcp), so a load
  # today reports spawn_failed — which is the honest answer, and visible in
  # /worker list rather than a silently absent worker.
  # NOTE: declared as stdio against a local path because pare-hardware-mcp does
  # not exist yet. It is designed to run on pare-bench (the Pi) as
  # transport: streamable_http with an endpoint — see the ArcticBase/artifacts
  # spec. Change both together; a networked worker also needs autoload: false
  # (already set), connect_timeout, read_timeout and artifact_root.
  hardware:
    command: /mnt/secondary/projects/PARE/.venv/bin/pare-hardware-mcp
    transport: stdio
    # FLOOR — raised from medium. RiskAwareToolPool gates only high and
    # critical (risk_pool.py:386), so a medium floor meant any hardware tool
    # that failed to advertise a wire tier — a half-wired dev build, or a
    # tampered one under-reporting — DISPATCHED WITH NO PROMPT AT ALL,
    # bypassing every approval surface. A floor of high means the worst case
    # is a prompt, not a silent flash write.
    risk_default: high
    autoload: false
    capability_tags: [hardware, uart, jtag, glitch]

  # --- apk_re_agents (Streamable HTTP) — disabled until services run + discovery hardened ---
  # unpacker:
  #   endpoint: http://127.0.0.1:9000/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, decompile]
  # manifest_analyzer:
  #   endpoint: http://127.0.0.1:9001/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, manifest]
  # string_extractor:
  #   endpoint: http://127.0.0.1:9002/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, strings]
  # network_mapper:
  #   endpoint: http://127.0.0.1:9003/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, network]
  # code_analyzer:
  #   endpoint: http://127.0.0.1:9004/mcp
  #   transport: streamable_http
  #   risk_default: medium
  #   capability_tags: [static, apk, code]
  # api_extractor:
  #   endpoint: http://127.0.0.1:9005/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, api]
  # report_synthesizer:
  #   endpoint: http://127.0.0.1:9006/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, report]
  # mobsf_analyzer:
  #   endpoint: http://127.0.0.1:9007/mcp
  #   transport: streamable_http
  #   risk_default: low
  #   capability_tags: [static, apk, mobsf]

# Operator policy: authoritative ceiling above whatever the worker self-declares
# over the wire. These pins survive a buggy/compromised worker that under-reports
# its tiers — fed into RiskGate(overrides=...) (override-up only).
risk_overrides:
  - ["frida_execute_script", "critical"]
  - ["frida_write_memory", "high"]
  # mitm is not read-only: these four mutate or forge traffic. Pinned so their
  # gating does not rest solely on what the worker advertises over the wire —
  # which a half-wired dev build may not advertise at all.
  - ["mitm_inject_request", "critical"]

  # --- hardware (pare-hardware-mcp), FORWARD-DECLARED ---------------------
  # The worker does not exist yet, so these match nothing today and
  # tests/test_risk_overrides_coverage.py reports them as unchecked rather
  # than failing. Once the package is installed, a pin matching no tool FAILS
  # that test — which is the point: it forces the tool names to be reconciled
  # against these patterns rather than shipped past them.
  #
  # critical means: prompts every time, can never be session-approved, and
  # requires a typed justification (risk_pool.py:387, :454, :463). That is the
  # correct posture for anything that writes to a target you cannot un-write.
  - ["hardware_flash_*", "critical"]
  - ["hardware_erase_*", "critical"]
  - ["hardware_write_*", "critical"]
  - ["hardware_glitch_*", "critical"]
  - ["mitm_add_blocking_rule", "high"]
  - ["mitm_add_modification_rule", "high"]
  - ["mitm_replay_flow", "high"]
